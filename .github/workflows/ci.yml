name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./ci-money-test.db
      PAYMENT_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate route types
        run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - name: Run unit and security tests
        run: npm run test:unit
      - run: npm run test:integration
      - name: Run scheduled-backup test
        run: python3 tests/scheduled-backup.test.py deploy/scheduled-backup.py
      - run: npm run db:postgres:check
      - name: Build Next.js production app
        run: npm run build

  docker:
    name: Docker production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image without publishing
        run: docker build --tag "saan:ci-${GITHUB_SHA}" .

  postgres:
    name: PostgreSQL migrations and constraints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saan
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: saan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saan -d saan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://saan:ci-only-password@localhost:5432/saan_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:postgres:check
      - run: npm run db:postgres:generate
      - run: npm run db:postgres:deploy
      - name: Verify migration deployment is repeatable
        run: npm run db:postgres:deploy
      - name: Verify migrations match the schema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/postgresql/schema.prisma --exit-code
      - run: npm run test:postgres
      - name: Verify durable mock receipts across processes
        run: node --conditions=react-server --import tsx --test tests/durable-mock.integration.test.ts

