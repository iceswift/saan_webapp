# Dedicated ingress: expose ONLY this path through the chosen public TLS endpoint.
# Never use this file as the private application's nginx.conf.
server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  location = /api/webhooks/omise {
    limit_except POST { deny all; }
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }
  location / { return 404; }
}
