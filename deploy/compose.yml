name: saan-staging
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: saan
      POSTGRES_DB: saan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:?Set absolute DATA_DIR}/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U saan -d saan"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  app:
    image: ${SAAN_IMAGE:?Set immutable SAAN_IMAGE tag}
    environment:
      DATABASE_URL: postgresql://saan:${POSTGRES_PASSWORD}@db:5432/saan?schema=public
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:?Set HTTPS SITE_URL}
      SITE_URL: ${SITE_URL}
      UPLOAD_DIR: /data/uploads
      APP_ENV: ${APP_ENV:-production}
      STAGING_TEST_MODE: ${STAGING_TEST_MODE:-false}
      STAGING_TEST_PHONES: ${STAGING_TEST_PHONES:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-unconfigured}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
    volumes:
      - ${DATA_DIR}/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 2g
    logging: *logging
  proxy:
    image: nginx:stable-bookworm
    ports:
      - "127.0.0.1:${HTTP_PORT:-3100}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
